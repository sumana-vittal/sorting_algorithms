name: Suoper-Linter

on: push

jobs:
  super-lint:
    name: Lint code base
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Run Super_linter
        uses: github/super-linter@v3
        env:
          DEFUALT_BRANCH: main
          GUTHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
